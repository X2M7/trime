name: Commit
on:
  push:
    branches: [develop]

permissions:
  contents: read

env:
  CI_NAME: Commit CI
jobs:
  build:
    if: ${{ github.repository == 'X2M7/trime' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - macos-26
          - macos-26-intel
          - windows-2025
    env:
      BUILD_ABI: armeabi-v7a,arm64-v8a,x86,x86_64
      # Keep audited source bytes unchanged in the checkout and all submodules.
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python for host data generation
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify pinned prediction source bytes
        run: python3 -B script/ci/check_predict_source_pins.py

      - name: Check release metadata and Pages
        run: python3 script/release/release.py metadata --check-pages

      - name: Test release checks
        run: python3 -m unittest discover -s script/release -p 'test_*.py'

      - name: Get branch name
        id: vars
        shell: bash
        run: |
          echo ${GITHUB_REF#refs/*/}
          echo CI_BRANCH=${GITHUB_REF#refs/*/} >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 17
          # will restore cache of dependencies and wrappers
          cache: 'gradle'

      - name: Setup Android SDK
        shell: python
        run: |
          import runpy
          runpy.run_path("script/ci/setup_android_cli.py", run_name="__main__")

      - name: Configure and verify host data tools
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          subprocess.run([sys.executable, "-B", "-m", "unittest", "discover", "-s", "script/ci", "-p", "test_*.py"], check=True, timeout=30)
          if sys.platform == "win32":
              import runpy
              runpy.run_path("script/ci/setup_windows_host_tools.py", run_name="__main__")

          sdk = Path(os.environ["ANDROID_HOME"])
          cmake_dir = sdk / "cmake" / "3.31.6" / "bin"
          cmake = cmake_dir / ("cmake.exe" if sys.platform == "win32" else "cmake")
          if not cmake.is_file():
              raise SystemExit(f"Missing SDK CMake: {cmake}")
          subprocess.run([str(cmake), "--version"], check=True, timeout=30)
          ninja = cmake_dir / ("ninja.exe" if sys.platform == "win32" else "ninja")
          if not ninja.is_file():
              raise SystemExit(f"Missing SDK Ninja: {ninja}")
          subprocess.run([str(ninja), "--version"], check=True, timeout=30)
          # The resource installer invokes python3; check that exact command too.
          subprocess.run(["python3", "-c", "import sys; print(sys.executable); print(sys.version); raise SystemExit(0 if sys.version_info >= (3, 11) else 'Python 3.11+ required')"], check=True, timeout=30)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as stream:
              stream.write(str(cmake_dir) + "\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write("CMAKE_EXECUTABLE=" + str(cmake) + "\n")

      - name: Check code style
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          make style-lint

      - name: Test CMake adaptations
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          CMAKE_EXECUTABLE="$ANDROID_HOME/cmake/3.31.6/bin/cmake" \
            python3 -B -m unittest discover -s script/quality -p 'test_*_cmake.py' -v

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
            ./gradlew --warning-mode=fail :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v6
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ matrix.os }}-trime-jni-debug-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Fetch submodules
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: |
          git submodule update --init --recursive

      - name: Build debug Trime
        run: |
          make debug

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        shell: bash
        run: cp -R app/build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib app/prebuilt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: trime-${{ matrix.os }}
          path: app/build/outputs/apk/debug/
          # keep 90 days
          retention-days: 90

      - name: Upload APK artifact (ARM64_V8A only)
        uses: actions/upload-artifact@v7
        with:
          name: trime-arm64-v8a-${{ matrix.os }}
          path: app/build/outputs/apk/debug/*arm64-v8a-*.apk
          # keep 90 days
          retention-days: 90

      - name: Upload JNI artifact (librime_jni.so)
        uses: actions/upload-artifact@v7
        with:
          name: librime_jni-${{ matrix.os }}
          path: app/build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib/*
          # keep 90 days
          retention-days: 90

      # setup-java saves Gradle caches in its post step; release Windows file locks first.
      - name: Stop Gradle daemons before cache save
        if: ${{ always() && runner.os == 'Windows' }}
        run: ./gradlew --stop
