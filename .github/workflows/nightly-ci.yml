name: Nightly validation
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *' # UTC 16:00 / GMT+8 0:00, daily

permissions:
  contents: read

# The scheduled job is read-only; it does not replace a release or move a tag.
jobs:
  validate:
    if: ${{ github.repository == 'X2M7/trime' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Check release metadata and Pages
        run: python3 script/release/release.py metadata --check-pages

      - name: Test release checks
        run: python3 -m unittest discover -s script/release -p 'test_*.py'
