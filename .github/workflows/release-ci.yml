name: Release validation
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read

# Publication is a separate local operation after device acceptance. This job
# checks the source record and cannot create, replace, or delete a release.
jobs:
  validate:
    if: ${{ github.repository == 'X2M7/trime' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Check release metadata and Pages
        run: python3 script/release/release.py metadata --check-pages

      - name: Test release checks
        run: python3 -m unittest discover -s script/release -p 'test_*.py'
