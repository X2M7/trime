name: 问题报告 / Bug Report
description: 创建问题报告以帮助我们改进。 / Create a bug report to help us improve.
labels:
  - bug

body:
  - type: textarea
    id: summary
    attributes:
      label: 摘要 / Summary
      description: 简要描述遇到的问题，注明测试的是本 fork 的哪个构建。 / Briefly describe the bug and identify the tested fork build.
    validations:
      required: true

  - type: textarea
    id: step_to_reproduce
    attributes:
      label: 重现步骤 / Steps to Reproduce
      description: 如何重现该问题。 / How to reproduce the bug.
      placeholder: |
        1. 打开某界面 / Open page ...
        2. 点击某菜单 / Click menu ...
        3. 某处出问题 / Something went wrong ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 预期行为 / Expected Behavior
      description: 完成上述步骤后应该发生什么。 / What is expected to happen after the steps above.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 日志 / Log
      description: 附上日志以帮助定位问题。 / Attach log to help locate the bug.
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: 截图 / Screenshot
      description: 附上截图；使用 T00 工具采集时，同时附上相邻的 .identity.json。 / Attach screenshots and their .identity.json files when captured with the T00 tool.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 附加信息 / Additional Context
      description: 与此问题相关的上下文信息，比如在问题出现前做了什么、使用了什么主题等。 / Additional context about the bug, eg. what did you do before the bug appears or what theme you are using, etc.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### 设备信息 / Device Infomation

  - type: input
    id: os_version
    attributes:
      label: 系统版本 / OS Version
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: 应用版本 / App Version
      description: “关于”页面中的“更新日志”条目，长按复制。 / It could be found below "Changelog" in the "About" page, long press to copy it.
    validations:
      required: true

  - type: textarea
    id: build_info
    attributes:
      label: 构建信息 / Build Information
      description: “关于”页面中的“构建信息”条目，长按复制。 / It could be found below "Build information" in the "About" page, loog press to copy it.
    validations:
      required: true

  - type: textarea
    id: baseline_identity
    attributes:
      label: 测试基线 / Test Baseline
      description: 可附上 script/baseline 工具生成的 report.json 或 inventory.json；不要上传个人词库。 / Attach a report.json or inventory.json from script/baseline when available; do not upload personal dictionaries.
      placeholder: |
        Run ID / APK SHA-256:
        Package / Signer SHA-256:
        versionName / versionCode / Git SHA:
        ABI / Android version:
        Active schema / deployed resource checksums:
        Dictionary state: cold / learned (script hash) / existing-uncontrolled
    validations:
      required: false
